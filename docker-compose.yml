version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: edocode_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tasksdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - edocode_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: edocode_backend
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/tasksdb
      DOCKER_HOST: unix://var/run/docker.sock
      OPENAI_API_KEY: your_key
      SECRET_KEY: your_secret
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - edocode_network
    privileged: true

  frontend:   # ✅ FIXED: now correctly inside services
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: edocode_frontend
    ports:
      - "3000:3000"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WDS_SOCKET_PORT: "3000"
      NODE_ENV: development
    depends_on:
      - backend
    networks:
      - edocode_network

volumes:
  postgres_data:
    driver: local

networks:
  edocode_network:
    driver: bridge
